<section class="py-8 xl:py-14 bg-light_green border-4 border-white border-t-0">
    <div class="max-w-7xl mx-auto px-4 lg:px-8">
        {{ if heading }}
            <h2 class="font-cormorant text-black text-1xl lg:text-2xl mb-8 font-bold">{{ heading }}</h2>
        {{ /if }}
   
        {{ if entries_grid_entries }}
            <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-4 gap-0 lg:gap-4">
                {{ entries_grid_entries }}
                    {{ partial:partials/blocks/components/entires-card-small }}
                {{ /entries_grid_entries }}
            </div>
        {{ /if }}
    </div>
</section>
