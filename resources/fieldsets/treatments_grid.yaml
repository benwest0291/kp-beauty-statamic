title: 'Treatments Grid'
fields:
  -
    handle: heading
    field:
      type: text
      display: Heading
  -
    handle: content
    field:
      type: textarea
      display: Content
  -
    handle: treatment_entires
    field:
      collections:
        - treatments
      type: entries
      display: 'Treatment Entires'
  -
    handle: button
    field:
      type: group
      display: Button
      fields:
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
            width: 50
        -
          handle: button_link
          field:
            type: link
            display: 'Button Link'
            width: 50
