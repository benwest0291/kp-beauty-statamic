title: Banner
fields:
  -
    handle: background_image
    field:
      max_files: 1
      container: assets
      type: assets
      display: 'Background Image'
  -
    handle: heading
    field:
      type: text
      display: Heading
  -
    handle: button
    field:
      type: group
      display: Button
      fields:
        -
          handle: button_text
          field:
            type: text
            display: 'Button Text'
        -
          handle: button_link
          field:
            type: link
            display: 'Button Link'
